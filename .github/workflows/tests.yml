name: Tests

on:
  push:
    branches:
      - main
      - asset-engine
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install video runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core libraqm0

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt "pytest>=8.0,<9.0" "pytest-asyncio>=0.24,<2.0"

      - name: Compile Python files
        run: python -m compileall -q app tests

      - name: Run tests
        run: python -m pytest -q
